# PostgreSQL + Grafana dalam satu Pod. Kredensial dibaca dari Secret postgres-credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-grafana
  labels:
    app: postgres-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-grafana
  template:
    metadata:
      labels:
        app: postgres-grafana
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "grafana_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
          ports:
            - containerPort: 5432
        - name: grafana
          image: grafana/grafana-oss:10.4.1
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-grafana-service
spec:
  type: NodePort
  selector:
    app: postgres-grafana
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30300
