# Terapkan di namespace spark: kubectl apply -f k8s/spark-core.yaml -n spark
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels:
    app: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: apache/spark:3.5.0
          command: ["/opt/spark/bin/spark-class"]
          args: ["org.apache.spark.deploy.master.Master"]
          env:
            - name: SPARK_MODE
              value: master
          ports:
            - containerPort: 7077
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-service
spec:
  type: NodePort
  selector:
    app: spark-master
  ports:
    - name: submit
      port: 7077
      targetPort: 7077
      nodePort: 30077
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30080
